# Local infrastructure for running the services from source.
#   docker compose up -d
# Every chapter adds what it needs.
services:
  postgres:
    image: postgres:17-alpine
    container_name: payments-postgres
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      # 5433 on the host, so a Postgres you already run on 5432 does not clash.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the data volume is first created: one database per service.
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The gateway's rate limit counters, shared by every gateway instance.
  redis:
    image: redis:7-alpine
    container_name: payments-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Kafka in KRaft mode: a single node that is both broker and controller,
  # no ZooKeeper. Fine for a laptop; production runs at least three.
  kafka:
    image: apache/kafka:4.2.2
    container_name: payments-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created by the services that own them, with the partitions they choose.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Catches every email the notification service sends. Read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33
    container_name: payments-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI and API

  # Traces: every service sends spans here over OTLP. UI at http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: payments-jaeger
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP over HTTP

  # Metrics: scrapes /actuator/prometheus on every service. UI at http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: payments-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # The services run on the host while you develop: let the container reach it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Dashboards over Prometheus, with Jaeger for traces. http://localhost:3000 (no login)
  grafana:
    image: grafana/grafana:13.0.14
    container_name: payments-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
