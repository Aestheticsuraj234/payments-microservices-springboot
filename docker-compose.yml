# The infrastructure, and (in the "app" profile) the five services.
#
#   docker compose up -d --wait                         infrastructure only: run services from your IDE
#   docker compose --profile app up -d --build --wait   everything, as containers
#
# In the app profile only the gateway is published: the services are reachable
# from each other, never from your machine. That's the network rule the
# X-User-ID header relies on (chapter 6).

x-service: &service
  profiles: [app]
  restart: unless-stopped
  build:
    context: .
  environment: &service-env
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  # The JVM gets SIGTERM, finishes in-flight requests (server.shutdown: graceful), then exits.
  stop_grace_period: 30s

# A readiness check without curl (the JRE image has none): bash's /dev/tcp.
x-ready: &ready
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    container_name: payments-postgres
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      # 5433 on the host, so a Postgres you already run on 5432 does not clash.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the data volume is first created: one database per service.
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The gateway's rate limit counters, shared by every gateway instance.
  redis:
    image: redis:7-alpine
    container_name: payments-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Kafka in KRaft mode: a single node that is both broker and controller,
  # no ZooKeeper. Fine for a laptop; production runs at least three.
  kafka:
    image: apache/kafka:4.2.2
    container_name: payments-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: one for your machine (localhost:9092), one for containers (kafka:29092).
      # A client connects, then uses the address the broker advertises for that listener.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created by the services that own them, with the partitions they choose.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Catches every email the notification service sends. Read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33
    container_name: payments-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI and API

  # Traces: every service sends spans here over OTLP. UI at http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: payments-jaeger
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP over HTTP

  # Metrics: scrapes /actuator/prometheus on every service. UI at http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: payments-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # The services run on the host while you develop: let the container reach it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Dashboards over Prometheus, with Jaeger for traces. http://localhost:3000 (no login)
  grafana:
    image: grafana/grafana:13.0.14
    container_name: payments-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # --- The services (profile "app") ---------------------------------------

  auth-service:
    <<: *service
    build: {context: ., args: {SERVICE: auth-service}}
    image: payments/auth-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      AUTH_PRIVATE_KEY_LOCATION: file:/run/secrets/auth-signing-key
    secrets: [auth-signing-key]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      <<: *ready
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]

  wallet-service:
    <<: *service
    build: {context: ., args: {SERVICE: wallet-service}}
    image: payments/wallet-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      <<: *ready
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]

  transfer-service:
    <<: *service
    build: {context: ., args: {SERVICE: transfer-service}}
    image: payments/transfer-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transfer
      SPRING_HTTP_SERVICECLIENT_WALLET_BASEURL: http://wallet-service:8081
    depends_on:
      postgres: {condition: service_healthy}
      wallet-service: {condition: service_healthy}
    healthcheck:
      <<: *ready
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8083 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]

  notification-service:
    <<: *service
    build: {context: ., args: {SERVICE: notification-service}}
    image: payments/notification-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification
      SPRING_HTTP_SERVICECLIENT_AUTH_BASEURL: http://auth-service:8082
      SPRING_MAIL_HOST: mailpit
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      auth-service: {condition: service_healthy}
    healthcheck:
      <<: *ready
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8084 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]

  gateway:
    <<: *service
    build: {context: ., args: {SERVICE: gateway}}
    image: payments/gateway
    environment:
      <<: *service-env
      SPRING_DATA_REDIS_HOST: redis
      GATEWAY_SERVICES_AUTH: http://auth-service:8082
      GATEWAY_SERVICES_WALLET: http://wallet-service:8081
      GATEWAY_SERVICES_TRANSFER: http://transfer-service:8083
    # The only published port of the whole system.
    ports:
      - "8080:8080"
    depends_on:
      redis: {condition: service_healthy}
      auth-service: {condition: service_healthy}
      wallet-service: {condition: service_healthy}
      transfer-service: {condition: service_healthy}
    healthcheck:
      <<: *ready
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9080 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]

# The token signing key, from scripts/dev-keys.sh. Mounted as a file, never an
# environment variable: env vars leak into logs, crash reports and `docker inspect`.
secrets:
  auth-signing-key:
    file: ./secrets/auth-signing-key.pem

volumes:
  pgdata:
