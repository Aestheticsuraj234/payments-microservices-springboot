spring:
  application:
    name: auth-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    # Its own database: no other service may read users or tokens.
    url: jdbc:postgresql://localhost:5433/auth
    username: payments
    password: payments

server:
  port: 8082
  shutdown: graceful

management:
  # Observability (chapter 11).
  tracing:
    sampling:
      probability: 1.0   # keep every trace on a laptop; production samples, say 0.1
    propagation:
      type: w3c          # the standard traceparent header, understood by every service and Kafka
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces   # Jaeger, from docker-compose.yml
  otlp:
    metrics:
      export:
        enabled: false   # metrics are pulled by Prometheus instead
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # buckets, so Prometheus can compute p95 latency
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},%X{requestId:-}] "

auth:
  issuer: payments-auth
  audience: payments
  access-token-ttl: 15m
  refresh-token-ttl: 30d
  # A PKCS#8 PEM RSA private key (scripts/dev-keys.sh writes one). Without it,
  # the service makes a fresh key at startup: fine on a laptop, but tokens
  # stop working on every restart, and two instances wouldn't trust each other.
  private-key-location:
