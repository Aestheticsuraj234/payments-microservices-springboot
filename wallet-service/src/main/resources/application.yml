spring:
  application:
    name: wallet-service
  jackson:
    # Our JSON API speaks snake_case (created_at, owner_id), like the Go reference.
    property-naming-strategy: SNAKE_CASE
  datasource:
    # Matches docker-compose.yml. Override with SPRING_DATASOURCE_* environment variables.
    url: jdbc:postgresql://localhost:5433/wallet
    username: payments
    password: payments
  # Flyway runs src/main/resources/db/migration/V*.sql at startup, in order, once each.
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # Wait until every in-sync replica has the event, and let the producer
      # retry without creating duplicates within its session.
      acks: all
      properties:
        enable.idempotence: true
    template:
      # Each send is a span, and the record carries the trace in a traceparent header.
      observation-enabled: true

server:
  port: 8081
  # Finish in-flight requests before stopping, instead of cutting them off.
  shutdown: graceful

management:
  # Observability (chapter 11).
  tracing:
    sampling:
      probability: 1.0   # keep every trace on a laptop; production samples, say 0.1
    propagation:
      type: w3c          # the standard traceparent header, understood by every service and Kafka
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces   # Jaeger, from docker-compose.yml
  otlp:
    metrics:
      export:
        enabled: false   # metrics are pulled by Prometheus instead
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # buckets, so Prometheus can compute p95 latency
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness, for container platforms
      probes:
        enabled: true

logging:
  level:
    # Kafka clients print their whole configuration at INFO: too much noise.
    org.apache.kafka: WARN
  pattern:
    # Every line carries the trace and span ids (set by Micrometer Tracing) and the request id.
    correlation: "[%X{traceId:-},%X{spanId:-},%X{requestId:-}] "

wallet:
  max-amount: 100000000   # a million dollars, in cents
  page-size:
    default-size: 20
    max: 100
  idempotency:
    ttl: 24h
    lease: 1m
  outbox:
    topic: wallet.events
    partitions: 3
    poll-interval: 200ms
    batch-size: 100
    retention: 7d
