# Prometheus pulls metrics from every service every 5 seconds.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: payments
    metrics_path: /actuator/prometheus
    static_configs:
      # While developing, the services run on your machine, outside Docker.
      - targets:
          - host.docker.internal:9080   # gateway (its management port)
          - host.docker.internal:8081   # wallet-service
          - host.docker.internal:8082   # auth-service
          - host.docker.internal:8083   # transfer-service
          - host.docker.internal:8084   # notification-service

  # With `docker compose --profile app`, the services run as containers instead:
  # whichever set isn't running simply shows as down.
  - job_name: payments-containers
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:9080
          - wallet-service:8081
          - auth-service:8082
          - transfer-service:8083
          - notification-service:8084
