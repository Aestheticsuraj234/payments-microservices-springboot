# Keep real trace export and propagation on in tests (Boot turns export off by default,
# and with it, in this version, trace propagation); nothing listens, so silence the exporter.
spring.test.tracing.export=true
management.opentelemetry.tracing.export.otlp.endpoint=http://127.0.0.1:1/v1/traces
logging.level.io.opentelemetry.exporter=OFF
logging.level.io.opentelemetry.sdk=OFF
