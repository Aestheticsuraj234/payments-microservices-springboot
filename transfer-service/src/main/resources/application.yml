spring:
  application:
    name: transfer-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://localhost:5433/transfer
    username: payments
    password: payments
  http:
    serviceclient:
      # The HTTP service group "wallet": every client interface in it calls the
      # wallet service with these settings. Always set timeouts: the default
      # is to wait forever.
      wallet:
        base-url: http://localhost:8081
        connect-timeout: 1s
        read-timeout: 3s

server:
  port: 8083
  shutdown: graceful

management:
  # Observability (chapter 11).
  tracing:
    sampling:
      probability: 1.0   # keep every trace on a laptop; production samples, say 0.1
    propagation:
      type: w3c          # the standard traceparent header, understood by every service and Kafka
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces   # Jaeger, from docker-compose.yml
  otlp:
    metrics:
      export:
        enabled: false   # metrics are pulled by Prometheus instead
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # buckets, so Prometheus can compute p95 latency
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    # The breaker's state appears in /actuator/health, but an open breaker
    # must not make *this* service look unhealthy: we're fine, the wallet isn't.
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      wallet:
        # Judge the wallet on its last 10 calls, once there are at least 5.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        # Open when half of them failed, or were slower than 2 s.
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        # While open, every call fails at once. After 10 s, let 2 calls test the water.
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        # A 4xx is the wallet working fine and saying no: not a failure.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
        register-health-indicator: true
        allow-health-indicator-to-fail: false

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},%X{requestId:-}] "

transfer:
  max-amount: 100000000
  saga:
    poll-interval: 200ms
    batch-size: 10
    # How long a claimed transfer is ours: longer than any step takes.
    lease: 10s
    # The first retry's delay; it doubles each time, up to max-backoff.
    backoff: 1s
    max-backoff: 1m
